include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - macos/Flutter/ephemeral/**
    - macos/Pods/**
    - macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/**
    - macos/Runner.xcworkspace/xcshareddata/swiftpm/**
  errors:
    # Kept suppressed intentionally:
    #  - use_build_context_synchronously: pervasive guarded-by-`mounted` pattern
    #  - deprecated_member_use: `dart:html` web redirect + DropdownButtonFormField
    #    `value`->`initialValue` migration deferred (semantic review needed).
    use_build_context_synchronously: ignore
    deprecated_member_use: ignore

linter:
  rules:
    prefer_const_constructors: false
    avoid_print: false
