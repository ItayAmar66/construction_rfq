plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Release signing is loaded from android/key.properties, which is gitignored
// and never committed. See android/key.properties.example for the expected
// format and android/RELEASE_SIGNING.md for how to generate a keystore.
def keystorePropertiesFile = rootProject.file("key.properties")
def hasKeystoreProperties = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasKeystoreProperties) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.construction.rfq"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.construction.rfq"
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasKeystoreProperties) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasKeystoreProperties ? signingConfigs.release : null
        }
    }
}

// Fail fast (and only) when a release artifact is actually being assembled
// without real signing credentials, so `flutter build apk --debug` and other
// non-release tasks are never blocked by a missing keystore.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { task ->
        def name = task.name
        (name.contains("Release")) &&
            (name.startsWith("assemble") || name.startsWith("bundle") || name.startsWith("package"))
    }
    if (buildingRelease && !hasKeystoreProperties) {
        throw new GradleException(
            "Release build requested but android/key.properties was not found.\n" +
            "Create it from android/key.properties.example and point it at a real release keystore\n" +
            "before running a release build. See android/RELEASE_SIGNING.md for the exact steps.\n" +
            "Debug builds (flutter build apk --debug) do not require this file."
        )
    }
}

flutter {
    source = "../.."
}

dependencies {}
